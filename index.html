'use strict';
function uiIcon(name){const paths={day:'<path d="M3 10.5 12 3l9 7.5M5.5 9v11h5v-6h3v6h5V9"/>',week:'<rect x="3" y="5" width="18" height="16" rx="4"/><path d="M7 3v4m10-4v4M3 10h18M7 14h3m4 0h3m-10 4h3"/>',inbox:'<path d="m4 4-2 10v5a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5L20 4H4Z"/><path d="M2 14h6l2 3h4l2-3h6"/>',overdue:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',archive:'<rect x="3" y="4" width="18" height="4" rx="1.5"/><path d="M5 8v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8M9 12h6m-6 4 2 2 4-4"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z"/>',plus:'<path d="M12 5v14M5 12h14"/>',folder:'<path d="M3 8V6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8Z"/>',expand:'<path d="m8 3 4 4 4-4M8 21l4-4 4 4M4 12h16"/>',collapse:'<path d="m8 7 4-4 4 4M8 17l4 4 4-4M4 12h16"/>'};return '<svg class="ui-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(paths[name]||paths.plus)+'</svg>'}
const KEY='matrica.tasks.v1';const cats=[{label:'Срочно и важно',hint:"Нельзя откладывать: срок уже близко, а последствия важны. Например, оплатить счёт в последний день.",bg:'#2b1e24',fg:'#f59aa4',border:'#513039'},{label:'Важно, не срочно',hint:"Важно для вас, но время ещё есть. Например, заранее подготовиться к экзамену.",bg:'#172b26',fg:'#80d9b1',border:'#294d40'},{label:'Срочно, не важно',hint:"Нужно сделать скоро, но на ваши цели это почти не влияет. Например, подтвердить время доставки.",bg:'#2c271b',fg:'#e7c779',border:'#4d432b'},{label:'Не срочно, не важно',hint:"Необязательно и без спешки. Например, посмотреть случайные видео в интернете.",bg:'#202735',fg:'#a0b6de',border:'#364258'}];const months=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];const weekdays=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];const today=new Date();const pad=n=>String(n).padStart(2,'0');const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const parse=s=>new Date(s+'T12:00:00');const human=s=>{const d=parse(s);return `${weekdays[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tasks=[];let view='day',selected=fmt(today),monthDate=new Date(today.getFullYear(),today.getMonth(),1),weekStart=null,modalTask=null;const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();function save(){persistPending();cloudSave().catch(e=>{toast('Ошибка синхронизации: '+e.message);console.error(e)})}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',2600)}function moveDate(s,n){let d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}function monthLabel(d){return months[d.getMonth()][0].toUpperCase()+months[d.getMonth()].slice(1)+' '+d.getFullYear()}function go(v){view=v;render()}function selectDate(s){selected=s;monthDate=new Date(parse(s).getFullYear(),parse(s).getMonth(),1);view='day';render()}function changeMonth(n){monthDate=new Date(monthDate.getFullYear(),monthDate.getMonth()+n,1);selected=fmt(monthDate);render()}function renderNav(){const items=[['day','day','День'],['week','week','Неделя'],['inbox','inbox','Входящие'],['overdue','overdue','Хвосты'],['archive','archive','Архив']];document.getElementById('nav').innerHTML=items.map(([v,i,t])=>`<button class="${view===v?'active':''}" onclick="go('${v}')"><span class="nav-symbol">${uiIcon(i)}</span>${t}${v==='inbox'?' ('+tasks.filter(x=>!x.isFolder&&!x.date&&(!x.done||pendingCompletions.has(x.id))).length+')':''}</button>`).join('');document.getElementById('mobilebar').innerHTML=items.map(([v,i,t])=>`<button class="${view===v?'active':''}" onclick="go('${v}')"><span class="ico">${uiIcon(i)}</span>${t}</button>`).join('');const arr=[];for(let n=-3;n<=12;n++){const d=new Date(today.getFullYear(),today.getMonth()+n,1);arr.push(`<button class="monthbtn ${monthDate.getMonth()===d.getMonth()&&monthDate.getFullYear()===d.getFullYear()?'active':''}" onclick="monthDate=new Date(${d.getFullYear()},${d.getMonth()},1);selected=fmt(monthDate);go('day')">${monthLabel(d)}</button>`)}document.getElementById('months').innerHTML=arr.join('')}
function calendar(){const y=monthDate.getFullYear(),m=monthDate.getMonth(),offset=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();let out=`<div class="calendar"><div class="cal-head"><button class="btn" onclick="changeMonth(-1)">‹</button><strong>${monthLabel(monthDate)}</strong><button class="btn" onclick="changeMonth(1)">›</button></div><div class="cal-grid">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="weekday">${x}</div>`).join('')}`;for(let i=0;i<offset;i++)out+='<div></div>';for(let d=1;d<=days;d++){const s=fmt(new Date(y,m,d));out+=`<button class="calday ${s===selected?'selected':''} ${s===fmt(today)?'today':''} ${tasks.some(t=>t.date===s&&(!t.done||pendingCompletions.has(t.id)))?'has':''}" onclick="selectDate('${s}')">${d}</button>`}return out+'</div></div>'}
function taskHtml(t){if(quickEditor?.id===t.id)return quickEditorHtml();return `<div class="task" data-task-id="${t.id}" tabindex="0" draggable="true" ondragstart="startDrag(event,\'${t.id}\')" ondragend="clearDrag()"><button class="drag-handle" aria-label="Перетащить задачу" onpointerdown="touchDrag(event,\'${t.id}\')">⠿</button><input aria-label="Выполнить задачу" type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div class="taskbody"><button type="button" class="tasktitle quick-edit-title ${t.done?'done':''}" onclick="beginQuickEdit('${t.id}')">${esc(t.title)}</button>${t.note?`<button type="button" class="tasknote quick-edit-note" onclick="beginQuickEdit('${t.id}','note')">${esc(t.note)}</button>`:''}${t.time?`<div class="tasktime">◷ ${esc(t.time)}</div>`:''}</div><button class="taskmenu" title="Изменить задачу" onclick="editTask('${t.id}')">⋯</button></div>`}

 if(refreshPromise)return refreshPromise;

function folderBar(){return '<div class="folderbar">'+[['all','Все'],['','Без папки'],...tasks.filter(t=>t.isFolder).map(t=>[t.id,'📁 '+t.title])].map(([id,label])=>`<button class="btn ${inboxFolder===id?'selected':''}" onclick="inboxFolder='${id}';render()">${esc(label)}</button>`).join('')+'<button class="btn" onclick="addFolder()">＋ Папка</button></div>'}
function folderSelect(t){return `<label class="field">Папка во Входящих<select id="t-folder"><option value="">Без папки</option>${tasks.filter(f=>f.isFolder).map(f=>`<option value="${f.id}" ${t.folderId===f.id?'selected':''}>${esc(f.title)}</option>`).join('')}</select></label>`}
function addFolder(){document.getElementById('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><form class="modal" onsubmit="saveFolder(event)"><h2>Новая папка</h2><label class="field">Название папки<input id="folder-title" required maxlength="100" placeholder="Например, Работа"></label><p id="folder-error" class="small" role="alert" style="color:#c14d4d"></p><div class="modalactions"><div></div><div><button class="btn" type="button" onclick="closeModal()">Отмена</button><button class="btn primary" type="submit">Создать</button></div></div></form></div>`;document.getElementById('folder-title').focus()}
function saveFolder(event){event.preventDefault();const input=document.getElementById('folder-title'),title=input.value.trim();if(!title){input.setCustomValidity('Введите название папки');input.reportValidity();input.oninput=()=>input.setCustomValidity('');return}if(tasks.some(t=>t.isFolder&&t.title.toLocaleLowerCase()===title.toLocaleLowerCase())){document.getElementById('folder-error').textContent='Папка с таким названием уже существует';return}const id=uid();tasks.push({id,title,note:'',date:'',time:'',cat:1,done:false,isFolder:true,createdAt:new Date().toISOString()});inboxFolder=id;save();closeModal();render();toast('Папка создана')}
function moveTask(id,date,cat){const t=tasks.find(t=>t.id===id&&!t.isFolder);if(!t||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isInteger(cat)||cat<0||cat>3)return;t.date=date;t.cat=cat;save();render();toast('Задача перенесена')}
function startDrag(e,id){draggedTask=id;e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move'}
function clearDrag(){draggedTask=null;document.querySelectorAll('.dragover').forEach(e=>e.classList.remove('dragover'))}
function dragOver(e){if(!draggedTask)return;e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('dragover')}
function dropTask(e){e.preventDefault();const el=e.currentTarget,id=draggedTask;clearDrag();if(id)moveTask(id,el.dataset.date,Number(el.dataset.cat))}
function touchDrag(e,id){if(e.pointerType==='mouse')return;e.preventDefault();const handle=e.currentTarget;handle.setPointerCapture(e.pointerId);let target=null;
 const move=ev=>{clearDrag();target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.quad');target?.classList.add('dragover')};
 const finish=ev=>{handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',finish);handle.removeEventListener('pointercancel',finish);clearDrag();if(ev.type==='pointerup'&&target)moveTask(id,target.dataset.date,Number(target.dataset.cat))};
 handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',finish)}
function resumeSync(){if(document.visibilityState==='hidden'||!cloudUser)return;cloudRefresh().catch(e=>{cloudStatus('Ожидаем подключения');console.error(e)})}
document.addEventListener('visibilitychange',resumeSync);window.addEventListener('focus',resumeSync);window.addEventListener('pageshow',resumeSync);window.addEventListener('online',resumeSync);

let selectedTaskId=null,taskClipboard=null,pasteTarget=null;
function paintTaskSelection(){document.querySelectorAll('[data-task-id]').forEach(el=>{el.classList.toggle('task-selected',el.dataset.taskId===selectedTaskId);el.classList.toggle('task-cut',taskClipboard?.mode==='cut'&&el.dataset.taskId===taskClipboard.task.id)});document.querySelectorAll('.quad').forEach(el=>el.classList.toggle('paste-target',el.dataset.date===pasteTarget?.date&&Number(el.dataset.cat)===pasteTarget?.cat))}
function selectTaskForClipboard(event){if(document.getElementById('modalroot').children.length)return;const row=event.target.closest('[data-task-id]'),quad=event.target.closest('.quad');if(row)selectedTaskId=row.dataset.taskId;else if(quad)selectedTaskId=null;if(quad)pasteTarget={date:quad.dataset.date,cat:Number(quad.dataset.cat)};paintTaskSelection();updateTaskTools()}
function taskKeyboard(event){if(!(event.metaKey||event.ctrlKey)||event.altKey||event.shiftKey||event.repeat)return;const target=event.target;if(target.closest('input,textarea,select,[contenteditable]:not([contenteditable="false"])')||document.getElementById('modalroot').children.length||document.getElementById('authroot').children.length)return;const key=event.code==='KeyC'?'c':event.code==='KeyX'?'x':event.code==='KeyV'?'v':event.key.toLowerCase();if(key==='c'||key==='x'){if(window.getSelection()?.toString())return;const task=tasks.find(t=>t.id===selectedTaskId&&!t.isFolder);if(!task)return;event.preventDefault();taskClipboard={mode:key==='x'?'cut':'copy',task:{...task},userId:cloudUser?.id};paintTaskSelection();toast(key==='x'?'Задача вырезана. Выберите дату и нажмите ⌘V':'Задача скопирована. Выберите дату и нажмите ⌘V');return}if(key!=='v'||!taskClipboard||taskClipboard.userId!==cloudUser?.id)return;if(!['day','week','inbox'].includes(view)){toast('Откройте дату или Входящие для вставки');return}event.preventDefault();const source=taskClipboard.task;const date=view==='inbox'?'':view==='week'&&pasteTarget?pasteTarget.date:selected;const cat=pasteTarget?.date===date?pasteTarget.cat:source.cat;const folderId=view==='inbox'?(inboxFolder==='all'?'':inboxFolder):source.folderId||'';let pasted;if(taskClipboard.mode==='cut'){pasted=tasks.find(t=>t.id===source.id&&!t.isFolder);if(!pasted){taskClipboard=null;paintTaskSelection();toast('Исходная задача больше не существует');return}Object.assign(pasted,{date,cat,folderId});taskClipboard=null}else{pasted={...source,id:uid(),date,cat,folderId,done:false,completedAt:null,createdAt:new Date().toISOString()};tasks.push(pasted)}selectedTaskId=pasted.id;save();render();paintTaskSelection();toast('Задача вставлена')}
document.addEventListener('click',selectTaskForClipboard);document.addEventListener('focusin',selectTaskForClipboard);document.addEventListener('keydown',event=>{if(!(event.metaKey||event.ctrlKey))return;const key=event.code||event.key;if(['KeyC','KeyX','KeyV','c','x','v','C','X','V'].includes(key))return;taskKeyboard(event)});

function taskShortcutAllowed(target){return target?.closest&&!target.closest('input,textarea,select,[contenteditable]:not([contenteditable="false"])')&&!document.getElementById('modalroot').children.length&&!document.getElementById('authroot').children.length}
function taskClipboardEvent(event){if(!taskShortcutAllowed(event.target))return;const action=event.type==='copy'?'c':event.type==='cut'?'x':'v';if(action==='v'&&!taskClipboard)return;if(action!=='v'&&window.getSelection()?.toString())return;let handled=false;taskKeyboard({metaKey:true,code:'Key'+action.toUpperCase(),key:action,target:event.target,preventDefault(){handled=true}});if(!handled)return;event.preventDefault();if(action!=='v'&&event.clipboardData){event.clipboardData.setData('text/plain',taskClipboard.task.title+(taskClipboard.task.note?'\n'+taskClipboard.task.note:''));event.clipboardData.setData('application/x-matrica-task',JSON.stringify({version:1,id:taskClipboard.task.id}))}updateTaskTools()}
function taskToolbar(action){taskKeyboard({metaKey:true,code:'Key'+action.toUpperCase(),key:action,target:document.body,preventDefault(){}});updateTaskTools()}
function updateTaskTools(){const el=document.getElementById('tasktools');if(el)el.innerHTML=''}
document.addEventListener('copy',taskClipboardEvent);document.addEventListener('cut',taskClipboardEvent);document.addEventListener('paste',taskClipboardEvent);

const openFeedDays=new Set(),seenFeedDays=new Set();
function rememberFeedDays(){document.querySelectorAll('details[data-feed-day]').forEach(el=>{seenFeedDays.add(el.dataset.feedDay);if(el.open)openFeedDays.add(el.dataset.feedDay);else openFeedDays.delete(el.dataset.feedDay)})}
function restoreFeedDays(){document.querySelectorAll('details[data-feed-day]').forEach(el=>el.open=seenFeedDays.has(el.dataset.feedDay)?openFeedDays.has(el.dataset.feedDay):el.dataset.defaultOpen==='true')}
function expandFeed(open){document.querySelectorAll('details[data-feed-day]').forEach(el=>{el.open=open;seenFeedDays.add(el.dataset.feedDay);if(open)openFeedDays.add(el.dataset.feedDay);else openFeedDays.delete(el.dataset.feedDay)})}

function updateThemeButton(){const light=document.documentElement.dataset.theme==='light',button=document.getElementById('theme-toggle');if(button){button.innerHTML=uiIcon(light?'moon':'sun');button.setAttribute('aria-label',light?'Включить тёмную тему':'Включить светлую тему');button.title=light?'Включить тёмную тему':'Включить светлую тему'}document.querySelector('meta[name="theme-color"]')?.setAttribute('content',light?'#edf0f6':'#0c0e13')}
function toggleTheme(){const theme=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=theme;try{localStorage.setItem('matrica.theme.v1',theme)}catch{}updateThemeButton()}
updateThemeButton();

const ARCHIVE_RETENTION_MS=30*24*60*60*1000;
function archiveExpired(task,now=Date.now()){if(task.isFolder||!task.done||!task.completedAt)return false;const completed=Date.parse(task.completedAt);return Number.isFinite(completed)&&now-completed>=ARCHIVE_RETENTION_MS}
function completionLabel(task){const completed=task.completedAt?new Date(task.completedAt):null;return completed&&Number.isFinite(completed.getTime())?'Завершено '+new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(completed):'Дата завершения не сохранена'}
setInterval(resumeSync,60*60*1000);
render();cloudInit();
</script></body></html>
