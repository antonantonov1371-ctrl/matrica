margin-bottom:17px;font-size:13px}.section-card{background:white;border:1px solid #e6eaf1;border-radius:16px;padding:18px;margin-bottom:16px}.section-card h2{margin:0 0 12px}.inboxrow{display:flex;align-items:center;gap:8px;margin-bottom:14px}.inboxrow input{flex:1;min-width:0;border:1px solid #dfe5ee;border-radius:11px;padding:12px}.list-task{display:flex;align-items:center;gap:10px;border-top:1px solid #eef0f5;padding:13px 0}.list-task .taskbody{flex:1}.muted{color:#9199a6}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:#1c273a85;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:white;border-radius:20px;width:min(100%,510px);padding:23px;box-shadow:0 25px 100px #101c3640;max-height:90vh;overflow:auto}.modal h2{margin:0 0 18px}.field{display:grid;gap:6px;margin-bottom:14px;font-size:13px;font-weight:600;color:#5c6676}.field input,.field textarea,.field select{width:100%;border:1px solid #dfe4ed;border-radius:10px;padding:11px;background:white;color:#273043}.field textarea{min-height:75px;resize:vertical}.modalactions{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.modalactions>div{display:flex;gap:8px}.footer{font-size:12px;color:#9ba2ae;margin-top:35px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#26344f;color:white;border-radius:12px;padding:11px 18px;z-index:20;box-shadow:0 6px 25px #0002;display:none}.mobilebar{display:none}@media(max-width:850px){.app{display:block}.sidebar{display:none}.main{padding:18px 13px 85px}.top h1{font-size:25px}.quadrants{gap:8px}.quad{padding:10px;min-height:140px}.quadhead{font-size:12px}.task{padding:8px;gap:6px}.tasktitle{font-size:12px}.tasknote{font-size:11px}.dayhead h2{font-size:18px}.calendar{padding:12px}.mobilebar{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;border-top:1px solid #e3e8f0;display:flex;justify-content:space-around;padding:9px 4px max(10px,env(safe-area-inset-bottom));z-index:5;backdrop-filter:blur(12px)}.mobilebar button{border:0;background:transparent;color:#667184;font-size:11px;display:grid;gap:3px;justify-items:center}.mobilebar button.active{color:#2d66e6;font-weight:700}.mobilebar .ico{font-size:19px}.actions .btn{padding:9px 11px}}@media(max-width:365px){.quadhead{font-size:11px}.tasktitle{font-size:11px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">◩ Матрица<span>.</span></div><nav class="nav" id="nav"></nav><div class="side-title">Месяцы</div><div class="months" id="months"></div><div class="side-title">Облако</div><div id="cloudstatus" class="small" style="padding:0 10px;line-height:1.6">Подключение...</div><div style="padding:10px"><button class="btn" id="signout" style="display:none" onclick="cloudSignOut()">Выйти</button></div></aside><main class="main"><div class="top"><div><h1 id="heading">Моя матрица</h1><div class="subtitle" id="subtitle">Планируй важное, а не только срочное</div></div><div class="actions" id="actions"></div></div><div id="content"></div><div class="footer">Матрица · Облачная версия · Supabase</div></main></div><nav class="mobilebar" id="mobilebar"></nav><div id="modalroot"></div><div id="authroot"></div><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';const KEY='matrica.tasks.v1';const cats=[{label:'Срочно и важно',bg:'#fff0f0',fg:'#b94e52',border:'#f7d9da'},{label:'Важно, не срочно',bg:'#eaf8f0',fg:'#29855b',border:'#d1ecdc'},{label:'Срочно, не важно',bg:'#fff6dc',fg:'#aa781b',border:'#f2e4b4'},{label:'Не срочно, не важно',bg:'#edf1f7',fg:'#697a93',border:'#dfe6ef'}];const months=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];const weekdays=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];const today=new Date();const pad=n=>String(n).padStart(2,'0');const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const parse=s=>new Date(s+'T12:00:00');const human=s=>{const d=parse(s);return `${weekdays[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tasks=[];let view='day',selected=fmt(today),monthDate=new Date(today.getFullYear(),today.getMonth(),1),weekStart=null,modalTask=null;const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();function save(){cloudSave().catch(e=>{toast('Ошибка синхронизации: '+e.message);console.error(e)})}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',2600)}function moveDate(s,n){let d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}function monthLabel(d){return months[d.getMonth()][0].toUpperCase()+months[d.getMonth()].slice(1)+' '+d.getFullYear()}function go(v){view=v;render()}function selectDate(s){selected=s;monthDate=new Date(parse(s).getFullYear(),parse(s).getMonth(),1);view='day';render()}function changeMonth(n){monthDate=new Date(monthDate.getFullYear(),monthDate.getMonth()+n,1);selected=fmt(monthDate);render()}function renderNav(){const items=[['day','◫','День'],['week','▤','Неделя'],['inbox','✉','Входящие'],['overdue','◷','Хвосты'],['archive','✓','Архив']];document.getElementById('nav').innerHTML=items.map(([v,i,t])=>`<button class="${view===v?'active':''}" onclick="go('${v}')">${i} &nbsp; ${t}${v==='inbox'?' ('+tasks.filter(x=>!x.date&&!x.done).length+')':''}</button>`).join('');document.getElementById('mobilebar').innerHTML=items.map(([v,i,t])=>`<button class="${view===v?'active':''}" onclick="go('${v}')"><span class="ico">${i}</span>${t}</button>`).join('');const arr=[];for(let n=-3;n<=12;n++){const d=new Date(today.getFullYear(),today.getMonth()+n,1);arr.push(`<button class="monthbtn ${monthDate.getMonth()===d.getMonth()&&monthDate.getFullYear()===d.getFullYear()?'active':''}" onclick="monthDate=new Date(${d.getFullYear()},${d.getMonth()},1);selected=fmt(monthDate);go('day')">${monthLabel(d)}</button>`)}document.getElementById('months').innerHTML=arr.join('')}
function calendar(){const y=monthDate.getFullYear(),m=monthDate.getMonth(),offset=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();let out=`<div class="calendar"><div class="cal-head"><button class="btn" onclick="changeMonth(-1)">‹</button><strong>${monthLabel(monthDate)}</strong><button class="btn" onclick="changeMonth(1)">›</button></div><div class="cal-grid">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="weekday">${x}</div>`).join('')}`;for(let i=0;i<offset;i++)out+='<div></div>';for(let d=1;d<=days;d++){const s=fmt(new Date(y,m,d));out+=`<button class="calday ${s===selected?'selected':''} ${s===fmt(today)?'today':''} ${tasks.some(t=>t.date===s&&!t.done)?'has':''}" onclick="selectDate('${s}')">${d}</button>`}return out+'</div></div>'}
function taskHtml(t){return `<div class="task"><input aria-label="Выполнить задачу" type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div class="taskbody"><div class="tasktitle ${t.done?'done':''}">${esc(t.title)}</div>${t.note?`<div class="tasknote">${esc(t.note)}</div>`:''}${t.time?`<div class="tasktime">◷ ${esc(t.time)}</div>`:''}</div><button class="taskmenu" title="Изменить задачу" onclick="editTask('${t.id}')">⋯</button></div>`}
function dayHtml(s){const list=tasks.filter(t=>t.date===s&&!t.done),done=tasks.filter(t=>t.date===s&&t.done);return `<section class="day" id="day-${s}"><div class="dayhead"><h2>${human(s)}</h2><span class="count">${list.length} задач</span></div><div class="quadrants">${cats.map((c,i)=>{const ts=list.filter(t=>t.cat===i);return `<div class="quad" style="--bg:${c.bg};--fg:${c.fg};--border:${c.border}"><div class="quadhead"><span>${['●','●','●','●'][i]} ${c.label}</span><button title="Добавить задачу" onclick="newTask('${s}',${i})">+</button></div>${ts.length?ts.map(taskHtml).join(''):'<div class="empty">Пока нет задач</div>'}<button class="addline" onclick="newTask('${s}',${i})">＋ Добавить задачу</button></div>`}).join('')}</div>${done.length?`<details style="margin-top:10px"><summary class="small" style="cursor:pointer">Выполнено за день: ${done.length}</summary>${done.map(taskHtml).join('')}</details>`:''}</section>`}
function render(){renderNav();const content=document.getElementById('content'),heading=document.getElementById('heading'),subtitle=document.getElementById('subtitle'),actions=document.getElementById('actions');heading.textContent=({day:'Моя матрица',week:'Лента дней',inbox:'Входящие',overdue:'Хвосты',archive:'Архив'})[view];subtitle.textContent=({day:'Четыре приоритета на выбранный день',week:'Листай дни и планируй вперёд',inbox:'Запиши мысль сейчас — распредели позже',overdue:'Невыполненные задачи с прошлых дней',archive:'Всё, что ты уже сделал'})[view];actions.innerHTML='';if(['day','week'].includes(view)){actions.innerHTML=`<button class="btn ${view==='day'?'selected':''}" onclick="go('day')">День</button><button class="btn ${view==='week'?'selected':''}" onclick="go('week')">Лента</button><button class="btn primary" onclick="newTask('${selected}',0)">＋ Задача</button>`;if(view==='day'){content.innerHTML=calendar()+dayHtml(selected)}else{const start=selected;let dates=[];for(let i=0;i<21;i++)dates.push(moveDate(start,i));content.innerHTML=`<div class="banner">Показаны 21 день начиная с ${human(start).toLowerCase()}. Чтобы перейти на любую дату, открой режим «День» и выбери её в календаре.</div>${dates.map(s=>{const count=tasks.filter(t=>t.date===s&&!t.done).length;return count===0?`<details class="section-card" style="padding:12px 16px"><summary style="cursor:pointer;font-size:14px">${human(s)} <span class="small">· Нет задач · нажми, чтобы раскрыть</span></summary><div style="margin-top:14px">${dayHtml(s)}</div></details>`:dayHtml(s)}).join('')}`}}else if(view==='inbox'){const ts=tasks.filter(t=>!t.date&&!t.done);content.innerHTML=`<div class="section-card"><div class="inboxrow"><input id="quick" placeholder="Что нужно не забыть?" onkeydown="if(event.key==='Enter')quickAdd()"><button class="btn primary" onclick="quickAdd()">Добавить</button></div>${ts.length?ts.map(t=>`<div class="list-task"><div class="taskbody"><strong>${esc(t.title)}</strong>${t.note?`<div class="small">${esc(t.note)}</div>`:''}</div><button class="btn" onclick="editTask('${t.id}')">Разобрать</button></div>`).join(''):'<div class="muted">Входящие пусты. Здесь можно хранить мысли без даты и приоритета.</div>'}</div>`}else if(view==='overdue'){const ts=tasks.filter(t=>t.date&&t.date<fmt(today)&&!t.done).sort((a,b)=>a.date.localeCompare(b.date));content.innerHTML=`<div class="section-card">${ts.length?ts.map(t=>`<div class="list-task"><input type="checkbox" onchange="toggleTask('${t.id}')"><div class="taskbody"><strong>${esc(t.title)}</strong><div class="small">${human(t.date)}</div></div><button class="btn" onclick="reschedule('${t.id}')">На сегодня</button><button class="btn" onclick="editTask('${t.id}')">Изменить</button></div>`).join(''):'<div class="muted">Просроченных задач нет. Отлично!</div>'}</div>`}else{const ts=tasks.filter(t=>t.done).sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));content.innerHTML=`<div class="section-card">${ts.length?ts.map(t=>`<div class="list-task"><input type="checkbox" checked onchange="toggleTask('${t.id}')"><div class="taskbody"><strong style="text-decoration:line-through;color:#8a94a4">${esc(t.title)}</strong><div class="small">${t.date?human(t.date):'Без даты'}</div></div><button class="btn" onclick="editTask('${t.id}')">Изменить</button></div>`).join(''):'<div class="muted">Здесь появятся выполненные задачи.</div>'}</div>`}if(view==='day')setTimeout(()=>{const el=document.querySelector('.day');if(el)el.scrollIntoView({block:'nearest'})},0)}
function quickAdd(){const input=document.getElementById('quick');const title=input.value.trim();if(!title)return;tasks.push({id:uid(),title,note:'',date:'',time:'',cat:1,done:false,createdAt:new Date().toISOString()});save();render();document.getElementById('quick')?.focus();toast('Добавлено во Входящие')}
function toggleTask(id){const t=tasks.find(t=>t.id===id);if(!t)return;t.done=!t.done;t.completedAt=t.done?new Date().toISOString():null;save();render()};function reschedule(id){const t=tasks.find(t=>t.id===id);if(t){t.date=fmt(today);save();render();toast('Перенесено на сегодня')}}
function newTask(date='',cat=0){modalTask=null;showModal({title:'',note:'',date,time:'',cat})}function editTask(id){const t=tasks.find(t=>t.id===id);if(t){modalTask=id;showModal(t)}}function showModal(t){document.getElementById('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><form class="modal" onsubmit="saveModal(event)"><h2>${modalTask?'Редактировать задачу':'Новая задача'}</h2><label class="field">Название<input id="t-title" required maxlength="300" value="${esc(t.title)}" placeholder="Что нужно сделать?"></label><label class="field">Описание<textarea id="t-note" placeholder="Детали, которые важно помнить">${esc(t.note)}</textarea></label><label class="field">Дата (можно оставить пустой — попадёт во Входящие)<input type="date" id="t-date" value="${esc(t.date)}"></label><label class="field">Время (не создаёт уведомление)<input type="time" id="t-time" value="${esc(t.time)}"></label><label class="field">Квадрат<select id="t-cat">${cats.map((c,i)=>`<option value="${i}" ${t.cat===i?'selected':''}>${c.label}</option>`).join('')}</select></label><div class="modalactions"><div>${modalTask?'<button type="button" class="btn" onclick="deleteTask()" style="color:#c14d4d">Удалить</button>':''}</div><div><button type="button" class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div></div></form></div>`;document.getElementById('t-title').focus()};function closeModal(){document.getElementById('modalroot').innerHTML=''}function saveModal(e){e.preventDefault();const title=document.getElementById('t-title').value.trim(),note=document.getElementById('t-note').value.trim(),date=document.getElementById('t-date').value,time=document.getElementById('t-time').value,cat=Number(document.getElementById('t-cat').value);if(!title)return;const t=modalTask?tasks.find(t=>t.id===modalTask):null;if(t)Object.assign(t,{title,note,date,time,cat});else tasks.push({id:uid(),title,note,date,time,cat,done:false,createdAt:new Date().toISOString()});save();closeModal();render();toast('Задача сохранена')}function deleteTask(){if(!modalTask||!confirm('Удалить задачу без возможности восстановления?'))return;tasks=tasks.filter(t=>t.id!==modalTask);save();closeModal();render();toast('Задача удалена')}

const CLOUD_URL='https://qageovdipbmegxfcsvdp.supabase.co', CLOUD_KEY='sb_publishable_S6jh0juDi-9tXB9OMY-now_qe53hTrc';

const cloudEl=()=>document.getElementById('cloudstatus');

function authScreen(msg=''){
 document.getElementById('authroot').innerHTML=`<div class="modalback" style="z-index:1000"><form class="modal" onsubmit="cloudAuth(event)"><h2>◩ Матрица — вход</h2><p class="small">Один аккаунт для MacBook и iPhone. Войди или зарегистрируйся.</p><label class="field">Электронная почта<input id="auth-email" type="email" autocomplete="email" required placeholder="mail@example.com"></label><label class="field">Пароль<input id="auth-password" type="password" autocomplete="current-password" minlength="12" required></label><p class="small" id="auth-message">${esc(msg)}</p><div class="modalactions"><button class="btn" type="button" onclick="cloudAuthAction='signup';document.getElementById('auth-form-submit').click()">Регистрация</button><button class="btn primary" id="auth-form-submit" type="submit">Войти</button></div></form></div>`;
}
let cloudAuthAction='signin';
async function cloudAuth(e){e.preventDefault();const email=document.getElementById('auth-email').value.trim(),password=document.getElementById('auth-password').value;const msg=document.getElementById('auth-message');msg.textContent='Подождите...';const res=cloudAuthAction==='signup'?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});cloudAuthAction='signin';if(res.error){msg.textContent=res.error.message;return}if(!res.data.session){msg.textContent='Проверь почту и подтверди регистрацию, затем войди.';return}document.getElementById('authroot').innerHTML='';await cloudLogin(res.data.session.user)}
async function cloudInit(){try{if(!window.supabase)throw new Error('Библиотека Supabase не загрузилась. Нужен интернет и доступ к CDN.');db=window.supabase.createClient(CLOUD_URL,CLOUD_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data,error}=await db.auth.getSession();if(error)throw error;db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){cloudUser=null;tasks=[];cloudSnapshot.clear();render();authScreen();cloudStatus('Не выполнен вход')}else if(event==='SIGNED_IN'&&session?.user&&!cloudUser){setTimeout(()=>cloudLogin(session.user),0)}});if(data.session?.user)await cloudLogin(data.session.user);else{authScreen();cloudStatus('Войдите в аккаунт')}}catch(e){cloudStatus('Ошибка: '+e.message);authScreen('Не удалось подключиться к Supabase: '+e.message)}}
function fromRow(r){return{id:r.id,title:r.title,note:r.description||'',date:r.task_date||'',time:r.task_time?.slice(0,5)||'',cat:r.quadrant===null?1:r.quadrant-1,done:r.completed,completedAt:r.completed_at,createdAt:r.created_at}}
function toRow(t){return{id:t.id,user_id:cloudUser.id,title:t.title,description:t.note||'',task_date:t.date||null,task_time:t.time||null,quadrant:t.date?t.cat+1:null,completed:!!t.done,completed_at:t.completedAt||null}}
async function cloudLogin(user){if(cloudUser?.id===user.id)return;cloudUser=user;document.getElementById('authroot').innerHTML='';document.getElementById('signout').style.display='block';cloudStatus('Загружаем задачи...');await cloudRefresh();if(cloudChannel)db.removeChannel(cloudChannel);cloudChannel=db.channel('tasks-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'tasks',filter:'user_id=eq.'+user.id},()=>{if(!cloudBusy)cloudRefresh().catch(console.error)}).subscribe()}
async function cloudRefresh(){if(!cloudUser)return;const {data,error}=await db.from('tasks').select('*').eq('user_id',cloudUser.id).order('created_at',{ascending:true});if(error){cloudStatus('Ошибка загрузки: '+error.message);throw error}tasks=data.map(fromRow);cloudSnapshot=new Map(tasks.map(t=>[t.id,JSON.stringify(toRow(t))]));cloudStatus('☁ Синхронизировано · '+cloudUser.email);render()}
async function cloudSave(){if(!cloudUser){toast('Сначала войдите в аккаунт');return}if(cloudBusy){cloudQueued=true;return}cloudBusy=true;cloudStatus('☁ Сохранение...');try{const current=new Map(tasks.map(t=>[t.id,JSON.stringify(toRow(t))]));const changes=tasks.filter(t=>cloudSnapshot.get(t.id)!==current.get(t.id));const deleted=[...cloudSnapshot.keys()].filter(id=>!current.has(id));if(changes.length){const {error}=await db.from('tasks').upsert(changes.map(toRow),{onConflict:'id'});if(error)throw error}if(deleted.length){const {error}=await db.from('tasks').delete().in('id',deleted).eq('user_id',cloudUser.id);if(error)throw error}cloudSnapshot=current;cloudStatus('☁ Синхронизировано · '+cloudUser.email)}finally{cloudBusy=false;if(cloudQueued){cloudQueued=false;cloudSave().catch(e=>{cloudStatus('Ошибка сохранения: '+e.message);toast(e.message)})}}}
async function cloudSignOut(){if(!confirm('Выйти из аккаунта Матрицы?'))return;await db.auth.signOut();cloudUser=null;tasks=[];cloudSnapshot.clear();render();authScreen();cloudStatus('Не выполнен вход');document.getElementById('signout').style.display='none'}

render();cloudInit();
</script></body></html>
